<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#079ac7" />
    <meta name="description" content="MJ Printing & Branding — custom apparel, printing and branding." />
    <title>MJ Printing & Branding</title>
    <style>
      html,body{margin:0;min-height:100%;font-family:Arial,sans-serif;color:#17242c}
      #startup-status{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;background:#f4f6f7}
      #startup-status section{width:min(100%,520px);padding:28px;box-sizing:border-box;background:#fff;border:1px solid #e3e7e9;border-radius:14px}
      #startup-status strong{color:#f28c28;letter-spacing:.08em}
      #startup-status p{line-height:1.6;color:#52616a}
      #startup-error{display:none;white-space:pre-wrap;overflow-wrap:anywhere;background:#fff1ef;color:#922f25;padding:12px;border-radius:8px;font-size:13px}
    </style>
  </head>
  <body>
    <div id="root">
      <main id="startup-status"><section>
        <strong>MJ PRINTING &amp; BRANDING</strong>
        <h1>Opening MJ Tees…</h1>
        <p>The website is loading. If this message remains, the diagnostic below will help identify the problem.</p>
        <pre id="startup-error"></pre>
      </section></main>
    </div>
    <script>
      (function () {
        function showStartupError(message) {
          var status = document.getElementById("startup-status");
          var output = document.getElementById("startup-error");
          if (!status || !output) return;
          status.querySelector("h1").textContent = "The website could not start";
          status.querySelector("p").textContent = "Please share this diagnostic message with support.";
          output.style.display = "block";
          output.textContent = String(message || "Unknown browser startup error");
        }
        window.addEventListener("error", function (event) {
          showStartupError(event.message || (event.target && (event.target.src || event.target.href)) || "A website asset failed to load.");
        }, true);
        window.addEventListener("unhandledrejection", function (event) {
          showStartupError(event.reason && (event.reason.message || String(event.reason)) || "An unhandled startup request failed.");
        });
        window.setTimeout(function () {
          var status = document.getElementById("startup-status");
          if (status && status.isConnected && status.querySelector("h1").textContent === "Opening MJ Tees…") {
            showStartupError("The application JavaScript did not finish starting. Check the network request for the main JavaScript bundle.");
          }
        }, 12000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
