name: Apparel inventory checks

on:
  pull_request:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apparel-inventory-checks.yml'
  push:
    branches: [feature/apparel-variant-inventory]
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/apparel-inventory-checks.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
