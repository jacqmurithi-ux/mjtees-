name: Deploy MJ Tees owner preview

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: mj-tees-owner-preview
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out first-release-build (without merging the PR)
        uses: actions/checkout@v4
        with:
          ref: first-release-build

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build website and owner workspace
        env:
          VITE_SUPABASE_URL: https://rbbluwsniiwzixlvdnwz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EvZpMrnBo_UHObXFDyXUdA_wkxhNbJB
          VITE_BUSINESS_SLUG: mj-tees
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
