name: Quality check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, feat/owner-first-production-workflow]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Type-check and build
        run: npm run build
      - name: Test shared pricing calculations
        run: npm run test:pricing
      - name: Test bulk printing safeguards
        run: npm run test:bulk-printing
      - name: Test Sales schema migration safeguards
        run: npm run test:sales-schema
      - name: Test custom order management safeguards
        run: npm run test:custom-orders
