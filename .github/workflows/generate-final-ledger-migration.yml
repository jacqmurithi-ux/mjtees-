name: Generate payment reversal and order discounts migration filename
on:
  push:
    branches: [first-release-build]
    paths: [".github/workflows/generate-final-ledger-migration.yml"]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate migration using pinned Supabase CLI
        run: npx --yes supabase@3.2.0 migration new payment_reversal_and_order_discount_allocation
      - uses: actions/upload-artifact@v4
        with:
          name: ledger-migration-filename
          path: supabase/migrations/*.sql
          retention-days: 3
