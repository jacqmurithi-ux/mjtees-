name: Validate frontend and database

on:
  pull_request:
    branches:
      - main
      - feat/milestone-08-daily-close-reporting
  push:
    branches:
      - feat/dynamic-pricing-automatic-rewards
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend typecheck, build and pricing tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run frontend build and TypeScript checks
        run: npm run build
      - name: Run pricing tests
        run: npm run test:pricing

  database:
    name: PostgreSQL migration replay and pgTAP
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.53.1
      - name: Start isolated local Supabase stack
        run: supabase start -x studio,imgproxy,edge-runtime,logflare,vector,supavisor,analytics
      - name: Replay every migration from an empty database
        run: supabase db reset --local
      - name: Run database pgTAP tests
        run: supabase test db
      - name: Stop local Supabase stack
        if: always()
        run: supabase stop --no-backup
