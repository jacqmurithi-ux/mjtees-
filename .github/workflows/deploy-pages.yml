name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out approved main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # These are public browser configuration values. The publishable key is
      # intentionally bundled into the static client; never put a secret key here.
      - name: Configure public application settings
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rbbluwsniiwzixlvdnwz.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_EvZpMrnBo_UHObXFDyXUdA_wkxhNbJB' }}
          VITE_BUSINESS_SLUG: ${{ vars.VITE_BUSINESS_SLUG || 'mj-tees' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '' }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_BUSINESS_SLUG"
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY"
            echo "VITE_BUSINESS_SLUG=$VITE_BUSINESS_SLUG"
            echo "VITE_TURNSTILE_SITE_KEY=$VITE_TURNSTILE_SITE_KEY"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Configure GitHub Pages base path
        id: pages
        uses: actions/configure-pages@v5
      - name: Build website and owner workspace
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@v4
