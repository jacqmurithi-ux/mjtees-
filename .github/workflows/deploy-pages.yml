name: Deploy GitHub Pages

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out approved main branch
        uses: actions/checkout@v4
        with:
          ref: main

      # These are public browser configuration values. The publishable key is
      # intentionally bundled into the static client; never put a secret key here.
      - name: Configure public application settings
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://rbbluwsniiwzixlvdnwz.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_EvZpMrnBo_UHObXFDyXUdA_wkxhNbJB' }}
          VITE_BUSINESS_SLUG: ${{ vars.VITE_BUSINESS_SLUG || 'mj-tees' }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY || '' }}
        run: |
          test -n "$VITE_SUPABASE_URL"
          test -n "$VITE_SUPABASE_PUBLISHABLE_KEY"
          test -n "$VITE_BUSINESS_SLUG"
          {
            echo "VITE_SUPABASE_URL=$VITE_SUPABASE_URL"
            echo "VITE_SUPABASE_PUBLISHABLE_KEY=$VITE_SUPABASE_PUBLISHABLE_KEY"
            echo "VITE_BUSINESS_SLUG=$VITE_BUSINESS_SLUG"
            echo "VITE_TURNSTILE_SITE_KEY=$VITE_TURNSTILE_SITE_KEY"
          } >> "$GITHUB_ENV"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Configure GitHub Pages base path
        id: pages
        uses: actions/configure-pages@v5
      - name: Build website and owner workspace
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}
        run: npm run build

      # Each workflow attempt gets a distinct name. This prevents a rerun from
      # leaving multiple github-pages artifacts for deploy-pages to choose from.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist

      # GitHub's artifact listing can lag immediately after upload. Wait until
      # the exact artifact is visible through the Actions API before deploying.
      - name: Wait for Pages artifact to become visible
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_NAME: github-pages-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          api_url="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"

          for attempt in $(seq 1 12); do
            response="$(curl --fail --silent --show-error \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "$api_url")"

            count="$(jq --arg name "$PAGES_ARTIFACT_NAME" \
              '[.artifacts[]? | select(.name == $name and .expired == false)] | length' \
              <<< "$response")"

            if [ "$count" -eq 1 ]; then
              echo "Confirmed exactly one visible Pages artifact: $PAGES_ARTIFACT_NAME"
              exit 0
            fi

            if [ "$count" -gt 1 ]; then
              echo "::error::Found $count artifacts named $PAGES_ARTIFACT_NAME; refusing an ambiguous deployment."
              exit 1
            fi

            echo "Pages artifact not visible yet (check $attempt/12); waiting 5 seconds."
            sleep 5
          done

          echo "::error::Pages artifact $PAGES_ARTIFACT_NAME did not become visible within 60 seconds."
          exit 1

      - name: Deploy approved site
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
