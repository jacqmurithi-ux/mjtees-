name: Deploy MJ Printing & Branding
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build
        env:
          VITE_SUPABASE_URL: https://rbbluwsniiwzixlvdnwz.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_EvZpMrnBo_UHObXFDyXUdA_wkxhNbJB
        run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - uses: actions/deploy-pages@v4