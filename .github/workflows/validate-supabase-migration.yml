name: Validate Supabase migration locally

on:
  pull_request:
    branches: [main, feat/owner-first-production-workflow]
    paths:
      - "supabase/migrations/**"
      - "supabase/functions/**"
      - "supabase/tests/**"
      - "supabase/config.toml"
      - ".github/workflows/validate-supabase-migration.yml"
  workflow_dispatch:

concurrency:
  group: supabase-local-validation
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Deno for Edge Function type checking
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Type-check public enquiry Edge Function
        run: deno check supabase/functions/submit-public-enquiry/index.ts
      - name: Check Supabase CLI version
        run: npx --yes supabase@3.2.0 --version
      - name: Show local-only CLI command options
        run: |
          npx --yes supabase@3.2.0 start --help
          npx --yes supabase@3.2.0 db reset --help
      - name: Start disposable local Supabase stack
        run: |
          npx --yes supabase@3.2.0 start --debug || { docker ps -a; for id in $(docker ps -aq); do echo "--- container $id ---"; docker logs --tail 150 "$id" || true; done; exit 1; }
      - name: Apply migrations to disposable local database
        run: npx --yes supabase@3.2.0 db reset --local --debug
      - name: Run database workflow tests
        run: |
          npx --yes supabase@3.2.0 test db --help
          npx --yes supabase@3.2.0 test db
      - name: Upload generated project config and migration validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: supabase-local-validation
          path: |
            supabase/config.toml
          if-no-files-found: warn
          retention-days: 3
      - name: Stop disposable local Supabase stack
        if: always()
        run: npx --yes supabase@3.2.0 stop --no-backup
