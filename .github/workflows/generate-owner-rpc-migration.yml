name: Generate owner RPC migration filename
on:
  push:
    branches: [first-release-build]
    paths: [".github/workflows/generate-owner-rpc-migration.yml"]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate migration using Supabase CLI
        run: |
          npx --yes supabase@3.2.0 migration new owner_transactional_backend
      - uses: actions/upload-artifact@v4
        with:
          name: owner-rpc-migration-name
          path: supabase/migrations/*.sql
          retention-days: 3
